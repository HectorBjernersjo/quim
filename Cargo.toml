[package]
name = "qb"
version = "0.1.0"
edition = "2021"
description = "TUI for running SQL against MSSQL databases — shares config with querybench"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
